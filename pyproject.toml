[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localready"
version = "0.1.0"
description = "Is your local model server ready to drive Claude Code, Codex or OpenCode? Probes the exact wire dialect the agent speaks, catches silent context truncation, measures agent-sized prefill and prefix caching, and prints the fix for llama.cpp, Ollama, LM Studio and vLLM. Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Prime-agentai" }]
keywords = ["local-llm", "llama.cpp", "ollama", "lm-studio", "vllm", "claude-code", "codex", "opencode", "coding-agents", "tool-calling", "context-window", "anthropic-api", "openai-api"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.8"]

[project.scripts]
localready = "localready.cli:main"

[project.urls]
Homepage = "https://github.com/Prime-agentai/localready"
Issues = "https://github.com/Prime-agentai/localready/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
localready = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.mypy]
strict = true
files = ["src"]
