name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check (types, tests, CLI end to end against fake engines)
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: uv run --python ${{ matrix.python }} --no-project --with pytest --with mypy bash -c 'PYTHON="$(command -v python)" bash scripts/check.sh'

  quickstart:
    # The README quickstart, literally, against a fake engine that truncates silently.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Quickstart
        shell: bash
        run: |
          src="$GITHUB_WORKSPACE"
          PYTHONPATH="$src/src" python3 tests/fakeserver.py 11434 n_ctx=4096 overflow=truncate engine=ollama &
          sleep 2
          uv tool run --from "$src" localready scan | grep -q 11434
          code=0; uv tool run --from "$src" localready check > out.txt || code=$?
          cat out.txt
          [ "$code" = 2 ]
          grep -q "OLLAMA_CONTEXT_LENGTH=65536" out.txt
          uv tool run --from "$src" localready env | grep -q "ANTHROPIC_BASE_URL=http://127.0.0.1:11434"
